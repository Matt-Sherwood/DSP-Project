<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Defender Ops Learning Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Azeret+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body data-route="{{ request.path }}">
    <div class="backdrop-glow"></div>
    <div class="grid-texture"></div>

    <header class="site-header">
      <a href="{{ url_for('index') }}" class="brand">
        <span class="brand-title">Defender Ops Lab</span>
        <span class="brand-sub">Learn by testing and proving your understanding</span>
      </a>
      <nav class="nav-links">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('learner_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('sqli_page') }}">SQLi</a>
        <a href="{{ url_for('xss_page') }}">XSS</a>
        <a href="{{ url_for('scraping_page') }}">Scraping</a>
        <a href="{{ url_for('sqlmap_page') }}">SQLMap</a>
        <a href="{{ url_for('terminal_page') }}">Terminal</a>
        <a href="{{ url_for('admin_page') }}">Database View</a>
      </nav>
    </header>

    <main class="page-shell">{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <p>
        Local defensive training only. Never test systems without explicit permission.
      </p>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
