<body>

    <h2>What is XSS?</h2>
    <p>Cross-Site Scripting (XSS) is a security vulnerability that allows attackers to inject malicious scripts into web pages viewed by other users.</p>
    <h3>Demo</h3>
    <form onsubmit="showResult(event)">
        <label for="input">Enter some text:</label>
        <input type="text" id="input" name="input">
        <button type="submit">Submit</button>
    </form>
    <p>Try these examples:</p>
    <button onclick="document.getElementById('input').value='<script>alert(\'XSS!\')</script>'">Fill: Basic XSS</button>
    <button onclick="document.getElementById('input').value='<img src=x onerror=alert(\'XSS\')>'">Fill: Image XSS</button>
    <button onclick="document.getElementById('input').value='<h1 style=\'color:red\'>HACKED!</h1><img src=x onerror=alert(\'XSS\')>'">Fill: HTML Injection</button>
    <div id="result"></div>
    <script>
        function showResult(event) {
            event.preventDefault();
            const input = document.getElementById('input').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<h4>Result:</h4><p>Your input: <code>' + input + '</code></p><p>Rendered HTML:</p><div style="border:1px solid #ccc; padding:10px; background:#f9f9f9;">' + input + '</div><p><strong>Warning:</strong> If you entered JavaScript, it may have executed!</p>';
        }
    </script>
</body>
