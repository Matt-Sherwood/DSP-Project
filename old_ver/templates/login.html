<body>

    <h2>What is SQL Injection?</h2>
    <p>SQL Injection is a code injection technique that exploits vulnerabilities in an application's software by inserting malicious SQL statements.</p>
    <h3>Demo</h3>
    <form onsubmit="simulateLogin(event)">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username"><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br>
        <button type="submit">Login</button>
    </form>
    <p>Try these examples:</p>
    <button onclick="document.getElementById('username').value='admin'; document.getElementById('password').value='password'">Fill: Normal Login</button>
    <button onclick="document.getElementById('username').value='wronguser'; document.getElementById('password').value='wrongpass'">Fill: Invalid Login</button>
    <button onclick="document.getElementById('username').value='\' OR \'1\'=\'1\' -- '; document.getElementById('password').value=''">Fill: SQL Injection</button>
    <button onclick="document.getElementById('username').value='\' UNION SELECT 1, username, password FROM users -- '; document.getElementById('password').value=''">Fill: Data Extraction</button>
    <div id="result"></div>
    <script>
        function simulateLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            let message = '';
            let success = false;
            let users = [];
            if (username === 'admin' && password === 'password') {
                message = 'Login Successful!';
                success = true;
                users = [{id: 1, username: 'admin', password: 'password'}];
            } else if (username.includes("' OR '1'='1")) {
                message = 'Login Successful! (SQL Injection bypassed authentication)';
                success = true;
                users = [{id: 1, username: 'admin', password: 'password'}];
            } else if (username.includes('UNION SELECT')) {
                message = 'Data extraction successful! Retrieved all user data:';
                success = false;
                users = [
                    {id: 1, username: 'admin', password: 'password'},
                    {id: 2, username: 'user', password: 'pass'}
                ];
            } else {
                message = 'Invalid Credentials';
                success = false;
            }
            const query = "SELECT * FROM users WHERE username = '" + username + "' AND password = '" + password + "'";
            resultDiv.innerHTML = '<h4>Result:</h4><p>' + message + '</p><p>Generated SQL Query: <code>' + query + '</code></p>';
            if (users.length > 0) {
                resultDiv.innerHTML += '<p>Found users:</p><ul>';
                users.forEach(user => {
                    resultDiv.innerHTML += '<li>ID: ' + user.id + ', Username: ' + user.username + ', Password: ' + user.password + '</li>';
                });
                resultDiv.innerHTML += '</ul>';
            }
        }
    </script>
</body>
